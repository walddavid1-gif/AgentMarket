<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentMarket - צור סיסמא חדשה</title>
  <style>
    :root {
      --brand: #185FA5;
      --brand-dark: #11497f;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --bg: #f4f8fc;
      --card: #ffffff;
      --border: #d8e2ee;
      --success-bg: #e7f6ee;
      --success-text: #1e7a43;
      --error-bg: #fbe9ea;
      --error-text: #ab2f3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #edf5ff 0%, var(--bg) 50%, #eef3f9 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 35px rgba(20, 62, 103, 0.12);
      padding: 24px;
    }

    .brand {
      margin: 0 0 6px;
      color: var(--brand);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      background-color: #fff;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.16);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
      transition: background-color 0.16s, transform 0.06s;
    }

    .btn:hover {
      background: var(--brand-dark);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #bfe6cf;
    }

    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #f4c2c7;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="איפוס סיסמא AgentMarket">
    <h1 class="brand">צור סיסמא חדשה</h1>
    <p class="subtitle">הזן סיסמא חדשה לחשבון שלך.</p>

    <form id="resetForm" method="post" action="#" novalidate>
      <div class="field">
        <label for="newPassword">סיסמא חדשה</label>
        <input id="newPassword" name="newPassword" type="password" minlength="6" autocomplete="new-password" required />
      </div>

      <div class="field">
        <label for="confirmPassword">אימות סיסמא</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required />
      </div>

      <button id="submitBtn" class="btn" type="submit">שמור סיסמא</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ugvmystwnfrglzaxpput.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVndm15c3R3bmZyZ2x6YXhwcHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDExODIsImV4cCI6MjA5MDYxNzE4Mn0.PtWBhJO3G5lQ3NQTfihHmVIIoK1AAaX9MTDyqP_YnSA";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("resetForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(type, text) {
      messageEl.className = "message " + type;
      messageEl.textContent = text;
    }

    function clearMessage() {
      messageEl.className = "message";
      messageEl.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!newPassword || !confirmPassword) {
        showMessage("error", "נא למלא את כל השדות.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("error", "הסיסמאות לא תואמות.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "שומר...";

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) {
          showMessage("error", "שגיאה בעדכון סיסמא: " + error.message);
          return;
        }

        showMessage("success", "הסיסמא עודכנה בהצלחה!");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } catch (err) {
        showMessage("error", "אירעה שגיאה בלתי צפויה. נסה שוב.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "שמור סיסמא";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentMarket — Hire Request</title>
  <style>
    :root {
      --brand: #185FA5;
      --brand-dark: #11497f;
      --bg: #f5f8fc;
      --card: #ffffff;
      --border: #d8e2ee;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --success-bg: #e7f6ee;
      --success-text: #1e7a43;
      --success-border: #bfe6cf;
      --error-bg: #fbe9ea;
      --error-text: #ab2f3a;
      --error-border: #f4c2c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #edf5ff 0%, var(--bg) 50%, #eef3f9 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 86px 16px 32px;
    }

    .title {
      font-size: 1.85rem;
      color: var(--brand);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.97rem;
      line-height: 1.45;
    }

    .summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: 0 6px 18px rgba(20, 62, 103, 0.06);
    }

    .summary-row + .summary-row {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .summary-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 1.05rem;
      font-weight: 600;
      word-break: break-word;
    }

    .price-value {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--brand);
    }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 6px 18px rgba(20, 62, 103, 0.06);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .optional {
      font-weight: 500;
      color: var(--muted);
      font-size: 0.86rem;
    }

    input[type="date"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    textarea.large {
      min-height: 160px;
    }

    input[type="date"]:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.16);
    }

    .btn-submit {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 16px;
      cursor: pointer;
      transition: background-color 0.16s, transform 0.06s;
    }

    .btn-submit:hover {
      background: var(--brand-dark);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Hire request</h1>
    <p class="subtitle">Describe what you need before payment. The agent owner will review your request.</p>

    <div class="summary" id="agentSummary">
      <div class="summary-row">
        <div class="summary-label">Agent</div>
        <div class="summary-value" id="summaryName">—</div>
      </div>
      <div class="summary-row">
        <div class="summary-label">Listed price</div>
        <div class="summary-value price-value" id="summaryPrice">—</div>
      </div>
    </div>

    <div class="form-card">
      <form id="requestForm" novalidate>
        <div class="field">
          <label for="description">What do you need?</label>
          <textarea id="description" class="large" name="description" required placeholder="Describe your goals, scope, and any context…"></textarea>
        </div>
        <div class="field">
          <label for="deadline">Deadline</label>
          <input id="deadline" name="deadline" type="date" required />
        </div>
        <div class="field">
          <label for="requirements">Special requirements <span class="optional">(optional)</span></label>
          <textarea id="requirements" name="requirements" placeholder="Tools, compliance, languages, access, etc."></textarea>
        </div>
        <button id="submitBtn" class="btn-submit" type="submit">Send Request</button>
        <div id="formMessage" class="message" role="status" aria-live="polite"></div>
      </form>
    </div>

    <a class="back-link" href="dashboard.html">← Back to dashboard</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const FALLBACK_SUPABASE_URL = "https://ugvmystwnfrglzaxpput.supabase.co";
    const FALLBACK_SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVndm15c3R3bmZyZ2x6YXhwcHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDExODIsImV4cCI6MjA5MDYxNzE4Mn0.PtWBhJO3G5lQ3NQTfihHmVIIoK1AAaX9MTDyqP_YnSA";

    async function loadSupabaseConfig() {
      try {
        const [urlRes, keyRes] = await Promise.all([
          fetch("API%20URL.txt"),
          fetch("Anon%20API.txt")
        ]);
        if (urlRes.ok && keyRes.ok) {
          const url = (await urlRes.text()).trim();
          const key = (await keyRes.text()).trim();
          if (url && key) {
            return { url, key };
          }
        }
      } catch (_) {
        /* use fallback */
      }
      return { url: FALLBACK_SUPABASE_URL, key: FALLBACK_SUPABASE_ANON_KEY };
    }

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        agentId: params.get("id") || params.get("agent_id") || "",
        name: params.get("name") || "",
        price: params.get("price") || ""
      };
    }

    function decodeText(value) {
      if (!value) return "";
      try {
        return decodeURIComponent(value.replace(/\+/g, " "));
      } catch {
        return value;
      }
    }

    function parseAmount(priceStr) {
      const cleaned = String(priceStr || "").replace(/[^\d.]/g, "");
      const n = parseFloat(cleaned);
      return Number.isFinite(n) && n > 0 ? n : null;
    }

    function showFormMessage(type, text) {
      const el = document.getElementById("formMessage");
      el.className = "message " + type;
      el.textContent = text;
    }

    function clearFormMessage() {
      const el = document.getElementById("formMessage");
      el.className = "message";
      el.textContent = "";
    }

    (async function init() {
      const cfg = await loadSupabaseConfig();
      window.AgentMarketSupabase = window.supabase.createClient(cfg.url, cfg.key);
      const supabaseClient = window.AgentMarketSupabase;

      const { agentId, name, price } = getQueryParams();
      const agentName = decodeText(name);
      const amount = parseAmount(price);

      document.getElementById("summaryName").textContent = agentName || "—";
      document.getElementById("summaryPrice").textContent =
        amount !== null ? "$" + amount.toFixed(2) : (price ? decodeText(price) : "—");

      function guardSession(session) {
        if (!session?.user) {
          window.location.replace("login.html");
        }
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      guardSession(session);

      supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
        guardSession(nextSession);
      });

      const form = document.getElementById("requestForm");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearFormMessage();

        if (!agentId) {
          showFormMessage("error", "Missing agent. Open this page from an agent listing with a valid link.");
          return;
        }

        const description = document.getElementById("description").value.trim();
        const deadline = document.getElementById("deadline").value;
        const requirements = document.getElementById("requirements").value.trim();

        if (!description) {
          showFormMessage("error", "Please describe what you need.");
          return;
        }
        if (!deadline) {
          showFormMessage("error", "Please choose a deadline.");
          return;
        }

        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError || !user) {
          window.location.replace("login.html");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";

        const row = {
          agent_id: agentId,
          client_id: user.id,
          description,
          deadline,
          requirements: requirements || null,
          status: "pending",
          created_at: new Date().toISOString()
        };

        const { error: insertError } = await supabaseClient.from("requests").insert(row);

        if (insertError) {
          showFormMessage("error", insertError.message || "Could not save your request.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Request";
          return;
        }

        const { data: agentData } = await supabaseClient
          .from("Agents")
          .select("user_id,name")
          .eq("id", agentId)
          .maybeSingle();

        if (agentData?.user_id) {
          await supabaseClient.from("notifications").insert({
            user_id: agentData.user_id,
            title: "New Request!",
            message: "Someone wants to hire your agent: " + (agentName || agentData.name || "Agent")
          });
        }

        showFormMessage("success", "Request sent! Waiting for owner approval.");
        form.querySelectorAll("input, textarea, button[type='submit']").forEach((el) => {
          el.disabled = true;
        });
        setTimeout(function () {
          window.location.href = "orders.html";
        }, 3000);
      });
    })();
  </script>
  <script src="navbar.js"></script>
</body>
</html>
